# Reusable lint + phát hành Helm chart dạng OCI lên ghcr.io/<owner>/charts. Gọi khi push tag v*:
#   on: { push: { tags: ['v*'] } }
#   jobs:
#     publish:
#       uses: vyforge/.github/.github/workflows/helm-publish.yml@v1
#       permissions: { contents: read, packages: write }
# Với pull_request chỉ lint + template, không push. Chart có thư mục ci/ thì lint với từng file ci/*.yaml.
name: Helm publish

on:
  workflow_call:
    inputs:
      charts-dir:
        type: string
        default: 'charts'
      helm-version:
        type: string
        default: 'v4.3.1'

permissions:
  contents: read

jobs:
  publish:
    name: helm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}
      - name: Lint & template
        env:
          DIR: ${{ inputs.charts-dir }}
        run: |
          for chart in "$DIR"/*/; do
            shopt -s nullglob
            values=("$chart"ci/*.yaml)
            if [ ${#values[@]} -eq 0 ]; then
              helm lint --strict "$chart"
              helm template ci "$chart" > /dev/null
            fi
            for file in "${values[@]}"; do
              echo "::group::$chart with $file"
              helm lint --strict "$chart" -f "$file"
              helm template ci "$chart" -f "$file" > /dev/null
              echo "::endgroup::"
            done
          done
      - name: Package & push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIR: ${{ inputs.charts-dir }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          version="${GITHUB_REF_NAME#v}"
          for chart in "$DIR"/*/; do
            helm package "$chart" --version "$version" --destination dist
          done
          for pkg in dist/*.tgz; do
            helm push "$pkg" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          done

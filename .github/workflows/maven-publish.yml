# Reusable phát hành thư viện Maven (platform-*) lên GitHub Packages. Gọi khi push tag v*:
#   on: { push: { tags: ['v*'] } }
#   jobs:
#     publish:
#       uses: vyforge/.github/.github/workflows/maven-publish.yml@v1
#       permissions: { contents: read, packages: write }
# Version lấy từ tag (v1.2.3 → 1.2.3) qua `-Drevision` (POM dùng `${revision}` + flatten-maven-plugin).
# Deploy tới GitHub Packages của chính repo, POM không cần <distributionManagement>.
name: Maven publish

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '25'

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
          server-id: github
      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Tag không phải semver: $GITHUB_REF_NAME"; exit 1; }
          ./mvnw -B -ntp deploy -Drevision="$version" \
            -DaltDeploymentRepository="github::https://maven.pkg.github.com/${GITHUB_REPOSITORY}"

# Reusable CI cho backend Java (Spring Boot). Gọi từ repo dự án:
#   jobs:
#     ci:
#       uses: vyforge/.github/.github/workflows/java-ci.yml@v1
#       permissions: { contents: read, packages: read }   # packages: đọc platform-* từ GitHub Packages
#       secrets: inherit                                    # truyền PACKAGES_TOKEN của repo
# Maven trên GitHub Packages chỉ cấp quyền theo repo nguồn: GITHUB_TOKEN của repo khác không tải được
# com.vyforge.platform:*. Repo dự án cần secret PACKAGES_TOKEN (PAT classic, chỉ scope read:packages).
name: Java CI

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '25'
      maven-args:
        type: string
        default: ''
    secrets:
      PACKAGES_TOKEN:
        description: PAT classic scope read:packages để tải com.vyforge.platform:* (thiếu thì dùng GITHUB_TOKEN)
        required: false

permissions:
  contents: read

jobs:
  verify:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
          # settings.xml có server "github" (GITHUB_ACTOR / GITHUB_TOKEN) để tải com.vyforge.platform:*
          # GITHUB_TOKEN ở bước Verify lấy PACKAGES_TOKEN nếu có.
          server-id: github
      # Spotless, test (Testcontainers), ArchUnit, Modulith verify, JaCoCo, CycloneDX SBOM
      - name: Verify
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp verify ${{ inputs.maven-args }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/spring-modulith-docs/
            target/classes/META-INF/sbom/
          if-no-files-found: ignore
          retention-days: 14

name: CD

on:
  push:
    branches: [ $default-branch ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    uses: vyforge/.github/.github/workflows/container.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write


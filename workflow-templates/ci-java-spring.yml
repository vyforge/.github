name: CI (Java / Spring Boot)

on:
  push:
    branches: [ $default-branch, develop ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build & test
        run: mvn -B verify
